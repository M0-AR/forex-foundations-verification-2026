services:
  research:
    build: .
    image: forex-foundations-verification-2026:1.0.0
    container_name: forex-research
    volumes:
      - ./results:/work/results
      - ./data:/work/data
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    command: bash scripts/run_all.sh

  notebook:
    build: .
    image: forex-foundations-verification-2026:1.0.0
    container_name: forex-notebook
    volumes:
      - ./results:/work/results
      - ./data:/work/data
    ports:
      - "8888:8888"
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    profiles:
      - lab
